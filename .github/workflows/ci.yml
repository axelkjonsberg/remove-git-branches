name: CI
on:
  push:
  pull_request:

jobs:
  bash:
    name: Bash (ShellCheck + bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats-core
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck

      - name: ShellCheck
        run: shellcheck -x bash/remove-git-branches.sh bash/tests/test_helper.bash

      - name: Run bats suite
        run: bats bash/tests/remove-git-branches.bats

  powershell:
    name: PowerShell (PSScriptAnalyzer + Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./PowerShell -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

      - name: Pester on PowerShell 7 (Core edition)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          Invoke-Pester -Path ./PowerShell/RemoveGitBranches/Tests -CI

      - name: Pester on Windows PowerShell 5.1 (Desktop edition)
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          Invoke-Pester -Path ./PowerShell/RemoveGitBranches/Tests -CI
